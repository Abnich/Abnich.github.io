<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>野生站点</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            padding: 20px;
        }
        .box {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        .error-tip {
            font-size: 22px;
            color: #ff4d4f;
            font-weight: bold;
        }
        h1 {
            margin-bottom: 20px;
            font-size: 28px;
        }
        p {
            font-size: 16px;
            line-height: 1.8;
            margin: 12px 0;
            opacity: 0.9;
        }
        .date {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 25px;
        }
        .menu {
            margin: 30px 0;
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .menu-item {
            background: rgba(255,255,255,0.2);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
        .menu-item:hover {
            background: rgba(255,255,255,0.3);
        }
        .back-btn {
            margin-top: 20px;
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            background: #fff;
            color: #667eea;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
<script>
// 修改你的访问密码
let secretPwd = "总不能是芝麻开门吧";
let inputPwd = prompt("阿里巴巴与四十大盗");

// 获取当前日期
function getNowDate(){
    const d = new Date();
    const y = d.getFullYear();
    const m = d.getMonth()+1;
    const day = d.getDate();
    const week = ["周日","周一","周二","周三","周四","周五","周六"][d.getDay()];
    return `${y}年${m}月${day}日 ${week}`;
}

if(inputPwd !== secretPwd){
    document.body.innerHTML = `
    <div class="box">
        <div class="error-tip">密码错误，无权访问本站</div>
    </div>
    `;
}else{
    document.body.innerHTML = `
    <div class="box">
        <div class="date">${getNowDate()}</div>
        <h1>Welcome</h1>
        <p>这里存放着一些乱七八糟的东西</p >
        <p>创立时间：2026.7.25.2</p >

        <div class="menu">
            <div class="menu-item">乱</div>
            <div class="menu-item">七</div>
            <div class="menu-item">八</div>
            <div class="menu-item">遭</div>
        </div>

        <button class="back-btn" onclick="history.back()">返回上一页</button>
    </div>
    `;
}
</script>
</body>
</html>
