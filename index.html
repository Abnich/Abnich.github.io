<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>野生站点</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            padding: 20px;
        }
        .box {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        .error-tip {
            font-size: 22px;
            color: #ff4d4f;
            font-weight: bold;
        }
        h1 {
            margin-bottom: 20px;
            font-size: 28px;
        }
        p {
            font-size: 16px;
            line-height: 1.8;
            margin: 12px 0;
            opacity: 0.9;
        }
        .date {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 25px;
        }
        .menu {
            margin: 30px 0;
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .menu-item {
            background: rgba(255,255,0.2);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
        .menu-item:hover {
            background: rgba(255,255,255,0.3);
        }
        .back-btn {
            margin-top: 20px;
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            background: #fff;
            color: #667eea;
            font-weight: bold;
            cursor: pointer;
        }
        textarea {
            width: 100%;
            height: 200px;
            padding: 12px;
            border-radius: 8px;
            border: none;
            margin: 15px 0;
            font-size: 15px;
            resize: vertical;
        }
        .btn-group button {
            padding: 8px 16px;
            margin: 0 5px;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
        }
        .save-btn {
            background: #667eea;
        }
        .sync-btn {
            background: #764ba2;
        }
        .show-area {
            margin-top: 20px;
            white-space: pre-wrap;
            text-align: left;
            padding: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            min-height: 60px;
        }
    </style>
</head>
<body>
<script>
// ========== 这里修改你的配置 ==========
let secretPwd = "总不能是芝麻开门吧";
const GITHUB_USER = "Abnich";
const GITHUB_REPO = "Abnich.github.io";
const GITHUB_TOKEN = "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";
const FILE_PATH = "note.md";
// ======================================

let inputPwd = prompt("阿里巴巴与四十大盗");

// 获取当前日期
function getNowDate(){
    const d = new Date();
    const y = d.getFullYear();
    const m = d.getMonth()+1;
    const day = d.getDate();
    const week = ["周日","周一","周二","周三","周四","周五","周六"][d.getDay()];
    return `${y}年${m}月${day}日 ${week}`;
}

// 从GitHub云端拉取笔记
async function loadFromCloud(){
    try {
        let res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FILE_PATH}`);
        let data = await res.json();
        let content = atob(data.content);
        document.getElementById("note").value = content;
        alert("已同步云端最新笔记");
    }catch(e){
        alert("暂无云端笔记，首次使用请先保存");
    }
}

// 保存笔记到GitHub云端
async function saveToCloud(){
    let content = document.getElementById("note").value;
    try {
        // 先获取文件sha
        let res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FILE_PATH}`);
        let data = await res.json();
        let sha = data.sha;

        // 更新文件
        await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FILE_PATH}`,{
            method: "PUT",
            headers:{
                "Authorization": `Bearer ${GITHUB_TOKEN}`,
                "Accept":"application/vnd.github.v3+json"
            },
            body: JSON.stringify({
                message: "更新私人笔记",
                content: btoa(content),
                sha: sha
            })
        });
        alert("笔记已同步到GitHub云端！");
    }catch(e){
        alert("同步失败，请检查token和仓库配置");
    }
}

if(inputPwd !== secretPwd){
    document.body.innerHTML = `
    <div class="box">
        <div class="error-tip">密码错误，无权访问本站</div>
    </div>
    `;
}else{
    document.body.innerHTML = `
    <div class="box">
        <div class="date">${getNowDate()}</div>
        <h1>Welcome</h1>
        <p>这里存放着一些乱七八糟的东西</p >
        <p>创立时间：2026.7.25</p >

        <div class="menu">
            <div class="menu-item">乱</div>
            <div class="menu-item">七</div>
            <div class="menu-item">八</div>
            <div class="menu-item">遭</div>
        </div>

        <h3 style="margin-top:25px;">私人记事本</h3>
        <textarea id="note" placeholder="在这里填写你的笔记内容..."></textarea>
        <div class="btn-group">
            <button class="save-btn" onclick="saveToCloud()">同步保存到云端</button>
            <button class="sync-btn" onclick="loadFromCloud()">拉取云端笔记</button>
        </div>
        <div id="showArea" class="show-area"></div>

        <button class="back-btn" onclick="history.back()">返回上一页</button>
    </div>
    `;
    // 进入后自动拉取云端笔记
    loadFromCloud();
}
</script>
</body>
</html>
